# .github/workflows/ci.yml
# CI para MiNavegador: tests + lint + benchmark de arranque

name: CI

on:
  push:
    branches: [main, nivel-8-11]
  pull_request:
    branches: [main, nivel-8-11]

jobs:
  test:
    name: Tests + Ruff
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m unittest discover -s pruebas -v

      - name: Run Ruff
        run: |
          ruff check .

  benchmark:
    name: Startup Benchmark
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para comparar con baseline en main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run benchmark (check mode)
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m pruebas.bench_startup --check
        # Si falla por no haber baseline, no bloquear el PR (solo main lo tiene)

      - name: Update baseline on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m pruebas.bench_startup --baseline
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pruebas/bench_baseline.json
          git commit -m "chore: update startup baseline" || echo "No changes"
          git push